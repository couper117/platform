name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client types are needed for the backend typecheck.
      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/backend/prisma/schema.prisma

      - name: Typecheck (frontend + backend)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Demo/real drift check
        run: npm run check:drift

      - name: Backend unit tests
        run: npm run test --workspace=apps/backend

      - name: Frontend unit tests
        run: npm run test --workspace=apps/frontend

  integration:
    name: API smoke tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rnsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rnsp
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rnsp
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
      PORT: "5000"
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        working-directory: apps/backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed database
        working-directory: apps/backend
        run: npm run seed:all

      - name: Start API
        working-directory: apps/backend
        run: npm start &

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/v1/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            echo "waiting for API... ($i)"; sleep 2
          done
          echo "API did not become healthy in time"; exit 1

      - name: API smoke / integration tests
        run: npm run test:smoke --workspace=apps/backend

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rnsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rnsp
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rnsp
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
      PORT: "5000"
      FRONTEND_URL: http://localhost:5173
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database (generate, migrate, seed)
        working-directory: apps/backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed:all

      - name: Install Playwright browser
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      # `npm run test:e2e` starts the full app via Playwright's webServer
      # (npm run dev), waits for :5173, then drives login → registration →
      # reporter flows.
      - name: Run e2e tests
        working-directory: apps/frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7
