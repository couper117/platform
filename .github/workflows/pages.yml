name: Deploy demo to GitHub Pages

# Publishes the standalone OFFLINE demo (demo/app — mock data, no backend) to
# GitHub Pages, giving a public live URL for pitching. The demo is fully
# self-contained, so it needs no database or secrets.
#
# ONE-TIME SETUP: in the repo, go to Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that this workflow deploys on every push to
# main that touches the demo. The site will be at:
#   https://<owner>.github.io/<repo>/   (e.g. https://couper117.github.io/platform/)

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base must match the Pages sub-path (/<repo>/) so assets resolve.
      - name: Build offline demo
        run: npm run build --workspace=demo/app -- --base=/${{ github.event.repository.name }}/

      - name: SPA fallback (client-side routing on Pages)
        run: cp demo/dist/index.html demo/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
